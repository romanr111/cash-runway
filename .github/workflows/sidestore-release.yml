name: SideStore Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.1"
        required: true
        type: string
      build:
        description: "Build number; defaults to GitHub run number"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sidestore-release
  cancel-in-progress: false

jobs:
  build-release-deploy:
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          BUILD="${{ inputs.build }}"
          if [[ -z "${BUILD}" ]]; then
            BUILD="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build=${BUILD}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes from git log
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-version:refname | grep -v '^v0\.0\.0' | grep -v -- '-test-pages' | sed -n '1p' || true)
          if [[ -n "${PREV_TAG}" ]]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          fi
          RAW_NOTES=$(git log "${RANGE}" --no-merges --format='%s')
          echo "release_notes<<EOFNOTES" >> "${GITHUB_OUTPUT}"
          echo "${RAW_NOTES}" >> "${GITHUB_OUTPUT}"
          echo "EOFNOTES" >> "${GITHUB_OUTPUT}"

      - name: Validate SideStore assets
        shell: bash
        run: |
          set -euo pipefail
          test -f sidestore/icon.png || {
            echo "Missing sidestore/icon.png. Add a 1024x1024 PNG icon before publishing." >&2
            exit 1
          }
          width=$(sips -g pixelWidth sidestore/icon.png 2>/dev/null | awk -F': ' '/pixelWidth/ {print $2}')
          height=$(sips -g pixelHeight sidestore/icon.png 2>/dev/null | awk -F': ' '/pixelHeight/ {print $2}')
          if [[ "${width}" != "1024" || "${height}" != "1024" ]]; then
            echo "sidestore/icon.png must be exactly 1024x1024 pixels." >&2
            exit 1
          fi

      - name: Set app version for this build
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.meta.outputs.version }}" AppHost/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.meta.outputs.build }}" AppHost/Info.plist

      - name: Configure feedback reporting
        shell: bash
        env:
          REPORT_ENDPOINT_URL: ${{ vars.CASH_RUNWAY_REPORT_ENDPOINT_URL || secrets.CASH_RUNWAY_REPORT_ENDPOINT_URL }}
          REPORT_CLIENT_SECRET: ${{ secrets.CASH_RUNWAY_REPORT_CLIENT_SECRET || secrets.CASH_RUNWAY_REPORT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${REPORT_ENDPOINT_URL}" ]]; then
            echo "::error::CASH_RUNWAY_REPORT_ENDPOINT_URL is required for SideStore release reporting." >&2
            exit 1
          fi
          if [[ -z "${REPORT_CLIENT_SECRET}" ]]; then
            echo "::error::CASH_RUNWAY_REPORT_CLIENT_SECRET or CASH_RUNWAY_REPORT_SECRET is required for SideStore release reporting." >&2
            exit 1
          fi
          REPORT_ENDPOINT_URL="${REPORT_ENDPOINT_URL%/}"
          if [[ "${REPORT_ENDPOINT_URL}" != */api/reports ]]; then
            REPORT_ENDPOINT_URL="${REPORT_ENDPOINT_URL}/api/reports"
          fi
          printf 'REPORT_ENDPOINT_URL=%s\n' "${REPORT_ENDPOINT_URL}" >> "${GITHUB_ENV}"
          umask 077
          cat > AppHost/ReportingConfig.local.xcconfig <<EOF
          CASH_RUNWAY_REPORT_ENDPOINT_URL = ${REPORT_ENDPOINT_URL}
          CASH_RUNWAY_REPORT_CLIENT_SECRET = ${REPORT_CLIENT_SECRET}
          CASH_RUNWAY_REPORTING_ENABLED = YES
          CASH_RUNWAY_REPORT_ENVIRONMENT = sidestore
          EOF
          swift Scripts/generate-reporting-secrets.swift

      - name: Install validation tools
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            brew install just
          fi
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          just --version
          swiftlint version

      - name: Run SwiftLint
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          just lint

      - name: Run repository validation
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          just check-isolated

      - name: Run simulator smoke
        timeout-minutes: 15
        shell: bash
        env:
          CASH_RUNWAY_SMOKE_BOOT_TIMEOUT_SECONDS: "120"
        run: |
          set -euo pipefail
          just smoke

      - name: Upload validation logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: sidestore-release-validation-logs
          path: /tmp/cash-runway-agent-validation
          if-no-files-found: ignore

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project CashRunway.xcodeproj \
            -scheme CashRunway \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build }}" \
            CASH_RUNWAY_REPORT_ENDPOINT_URL="${REPORT_ENDPOINT_URL}" \
            CASH_RUNWAY_REPORTING_ENABLED=YES \
            CASH_RUNWAY_REPORT_ENVIRONMENT=sidestore \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find DerivedData/Build/Products/Release-iphoneos -name 'CashRunway.app' -type d -print -quit)"
          test -n "${APP_PATH}" || { echo "CashRunway.app not found" >&2; exit 1; }

          rm -rf Payload CashRunway.ipa public
          mkdir -p Payload public
          cp -R "${APP_PATH}" Payload/CashRunway.app
          /usr/bin/zip -qry CashRunway.ipa Payload

          cp sidestore/icon.png public/icon.png
          touch public/.nojekyll

      - name: Verify packaged app metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_INFO="Payload/CashRunway.app/Info.plist"
          packaged_version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${APP_INFO}")"
          packaged_build="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "${APP_INFO}")"
          if [[ "${packaged_version}" != "${{ steps.meta.outputs.version }}" ]]; then
            echo "Packaged app version ${packaged_version} does not match source version ${{ steps.meta.outputs.version }}." >&2
            exit 1
          fi
          if [[ "${packaged_build}" != "${{ steps.meta.outputs.build }}" ]]; then
            echo "Packaged app build ${packaged_build} does not match source build ${{ steps.meta.outputs.build }}." >&2
            exit 1
          fi
          reporting_enabled="$(/usr/libexec/PlistBuddy -c "Print :CashRunwayReportingEnabled" "${APP_INFO}")"
          if [[ "${reporting_enabled}" != "YES" ]]; then
            echo "Packaged app reporting flag ${reporting_enabled} does not match expected YES." >&2
            exit 1
          fi

      - name: Generate SideStore source JSON
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.release_notes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import datetime

          version = "${{ steps.meta.outputs.version }}"
          build = "${{ steps.meta.outputs.build }}"
          size = os.path.getsize("CashRunway.ipa")
          date = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          ipa_url = f"https://github.com/romanr111/cash-runway/releases/download/v{version}/CashRunway.ipa"
          icon_url = "https://romanr111.github.io/cash-runway/icon.png"

          raw_notes = os.environ.get("RELEASE_NOTES", "").strip()
          if not raw_notes:
              raw_notes = f"SideStore build v{version}"
          lines = [ln.strip() for ln in raw_notes.splitlines() if ln.strip()]
          description = "\n".join(f"• {ln}" for ln in lines)
          MAX_LEN = 500
          if len(description) > MAX_LEN:
              description = description[:MAX_LEN - 3] + "..."

          source = {
              "name": "Cash Runway",
              "identifier": "dev.roman.cashrunway.source",
              "subtitle": "Personal finance runway tracker.",
              "description": "SideStore source for Cash Runway test builds.",
              "iconURL": icon_url,
              "website": "https://github.com/romanr111/cash-runway",
              "sourceURL": "https://romanr111.github.io/cash-runway/source.json",
              "tintColor": "#E85D3A",
              "featuredApps": ["dev.roman.cashrunway"],
              "apps": [
                  {
                      "name": "Cash Runway",
                      "bundleIdentifier": "dev.roman.cashrunway",
                      "developerName": "Roman Rud",
                      "subtitle": "Track cash runway and recurring costs.",
                      "localizedDescription": "Cash Runway is a personal finance app for tracking wallet balances, transactions, recurring costs, and financial runway.",
                      "iconURL": icon_url,
                      "tintColor": "#E85D3A",
                      "category": "utilities",

                      "version": version,
                      "versionDate": date,
                      "versionDescription": description,
                      "downloadURL": ipa_url,
                      "size": size,

                      "versions": [
                          {
                              "version": version,
                              "buildVersion": build,
                              "date": date,
                              "localizedDescription": description,
                              "downloadURL": ipa_url,
                              "size": size,
                              "minOSVersion": "18.0"
                          }
                      ],
                      "appPermissions": {
                          "entitlements": [],
                          "privacy": {
                              "NSPhotoLibraryUsageDescription": "Cash Runway uses photo access only when you choose to attach screenshots to a bug report."
                          }
                      }
                  }
              ],
              "news": []
          }

          pathlib.Path("public").mkdir(exist_ok=True)
          pathlib.Path("public/source.json").write_text(
              json.dumps(source, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.notes.outputs.release_notes }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"

          NOTES_FILE="$(mktemp)"
          printf '%s\n' "${RELEASE_NOTES}" > "${NOTES_FILE}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" CashRunway.ipa public/source.json --clobber
          else
            gh release create "${TAG}" CashRunway.ipa public/source.json \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --prerelease
          fi
          rm -f "${NOTES_FILE}"

      - name: Verify GitHub Pages is enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/pages" --jq '.source.branch' >/dev/null 2>&1; then
            echo "::error::GitHub Pages is not enabled for this repository." >&2
            echo "::error::Go to Settings → Pages → Build and deployment → Source: GitHub Actions → Save, then re-run this workflow." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy SideStore source to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
