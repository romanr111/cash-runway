name: iOS CI

on:
  workflow_dispatch:
    inputs:
      run_ui_e2e_tests:
        description: 'Run UI end-to-end tests'
        type: boolean
        default: false
        required: false
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: CashRunway.xcodeproj
  SCHEME: CashRunway

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Run static analysis
        shell: bash
        run: |
          set -euo pipefail
          swiftlint lint --reporter github-actions-logging 2>&1 | tee swiftlint.log

      - name: Upload static analysis logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-logs
          path: swiftlint.log
          if-no-files-found: ignore

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: static-analysis

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm/cache
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run unit tests - BankConnectionServiceTests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --filter 'BankConnectionServiceTests' \
            2>&1 | tee swift-unit-bank-connection.log

      - name: Run unit tests - BankSyncServiceTests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --filter 'BankSyncServiceTests' \
            2>&1 | tee swift-unit-bank-sync.log

      - name: Run unit tests - ModelSerializationTests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --filter 'ModelSerializationTests' \
            2>&1 | tee swift-unit-model-serialization.log

      - name: Run unit tests - BankCategoryMapperTests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --filter 'BankCategoryMapperTests' \
            2>&1 | tee swift-unit-bank-category.log

      - name: Run unit tests - UtilityAndModelTests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --filter 'UtilityAndModelTests' \
            2>&1 | tee swift-unit-utility.log

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --skip '(BankConnectionServiceTests|BankSyncServiceTests|ModelSerializationTests|BankCategoryMapperTests|UtilityAndModelTests)' \
            2>&1 | tee swift-integration-test.log

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | grep -E '(warning:|error:|BUILD SUCCEEDED|BUILD FAILED)'

      - name: Install SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Run static analysis
        shell: bash
        run: |
          set -euo pipefail
          swiftlint lint --reporter github-actions-logging 2>&1 | tee swiftlint.log

      - name: Run UI E2E tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          xcodebuild test \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -only-testing:CashRunwayUITests \
            -resultBundlePath TestResults/CashRunway.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcode-test.log | grep -E '(warning:|error:|Test Suite|Test Case|passed|failed|TEST SUCCEEDED|TEST FAILED|BUILD SUCCEEDED|BUILD FAILED)'

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-failure-logs
          path: |
            swift-unit-bank-connection.log
            swift-unit-bank-sync.log
            swift-unit-model-serialization.log
            swift-unit-bank-category.log
            swift-unit-utility.log
            swift-integration-test.log
            xcodebuild.log
            swiftlint.log
            xcode-test.log
            TestResults
          if-no-files-found: ignore