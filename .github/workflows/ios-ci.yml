name: iOS CI

on:
  workflow_dispatch:
    inputs:
      run_ui_e2e_tests:
        description: 'Run UI end-to-end tests'
        type: boolean
        default: false
        required: false
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: CashRunway.xcodeproj
  SCHEME: CashRunway

jobs:
  source-membership-check:
    name: Source Membership Check
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify CashRunwayCore module wiring
        shell: bash
        run: Scripts/check-core-module-wiring.sh

      - name: Verify no ungated logging
        shell: bash
        run: Scripts/check-no-ungated-logging.sh

      - name: Verify @unchecked Sendable justifications
        shell: bash
        run: Scripts/check-unchecked-sendable.sh

  static-analysis:
    name: Static Analysis
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Run static analysis
        shell: bash
        run: |
          set -euo pipefail
          swiftlint lint --reporter github-actions-logging 2>&1 | tee swiftlint.log

      - name: Upload static analysis logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-logs
          path: swiftlint.log
          if-no-files-found: ignore

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: static-analysis

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm/cache
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --filter '(ModelSerializationTests|UtilityAndModelTests|BankCategoryMapperTests|BankConnectionServiceTests|BankSyncServiceTests)' \
            2>&1 | tee swift-unit-test.log

      - name: Upload unit test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-logs
          path: swift-unit-test.log
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests
    runs-on: macos-26
    timeout-minutes: 90
    needs: static-analysis

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm/cache
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --skip '(ModelSerializationTests|UtilityAndModelTests|BankCategoryMapperTests|BankConnectionServiceTests|BankSyncServiceTests|CashRunwayPerformanceTests)' \
            2>&1 | tee swift-integration-test.log

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: swift-integration-test.log
          if-no-files-found: ignore

  app-build:
    name: Xcode App Build
    runs-on: macos-26
    timeout-minutes: 30
    needs: static-analysis

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm/cache
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Pick iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          if xcrun simctl list devices available | grep -q 'iPhone 17 ('; then
            destination='platform=iOS Simulator,name=iPhone 17'
          else
            device_name="$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/ && /Shutdown|Booted/ { sub(/^[[:space:]]+/, "", $1); print $1; exit }')"
            if [[ -z "${device_name}" ]]; then
              echo 'No available iPhone simulator found' >&2
              exit 1
            fi
            destination="platform=iOS Simulator,name=${device_name}"
          fi

          echo "destination=${destination}" >> "${GITHUB_OUTPUT}"
          echo "Using ${destination}"

      - name: Build app for simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            2>&1 | tee app-build.log

      - name: Upload app build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-build-logs
          path: app-build.log
          if-no-files-found: ignore

  ui-e2e-tests:
    name: UI End-to-End Tests
    runs-on: macos-26
    timeout-minutes: 60
    needs: integration-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_e2e_tests

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm/cache
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Pick iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          if xcrun simctl list devices available | grep -q 'iPhone 17 ('; then
            destination='platform=iOS Simulator,name=iPhone 17'
          else
            device_name="$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/ && /Shutdown|Booted/ { sub(/^[[:space:]]+/, "", $1); print $1; exit }')"
            if [[ -z "${device_name}" ]]; then
              echo 'No available iPhone simulator found' >&2
              exit 1
            fi
            destination="platform=iOS Simulator,name=${device_name}"
          fi

          echo "destination=${destination}" >> "${GITHUB_OUTPUT}"
          echo "Using ${destination}"

      - name: Run UI end-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -only-testing:CashRunwayUITests \
            -resultBundlePath ui-e2e.xcresult \
            2>&1 | tee ui-e2e-test.log

      # PR 124: export the named screenshot attachments (.keepAlways lifetime)
      # recorded by the UI tests so they can be published as PR evidence. The
      # modern `export attachments` subcommand ships in Xcode 16+; fall back to
      # the legacy plist manifest walk on older toolchains.
      - name: Export screenshot attachments from result bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-screenshots
          STAGING="$(mktemp -d)"
          export STAGING
          if xcrun xcresulttool export attachments \
              --path ui-e2e.xcresult \
              --output-path "$STAGING"; then
            echo "Exported via xcresulttool export attachments"
            # The command dumps SHA-named files plus a manifest.json mapping
            # each to its XCTAttachment name; copy the pr124-* PNGs out under
            # their human-readable names.
            python3 - <<'PY'
          import json, os, shutil

          staging = os.environ["STAGING"]
          with open(os.path.join(staging, "manifest.json")) as fh:
              manifest = json.load(fh)
          entries = manifest if isinstance(manifest, list) else manifest.get("testEntries", [])
          for entry in entries:
              if not isinstance(entry, dict):
                  continue
              for attachment in entry.get("attachments", []):
                  name = attachment.get("suggestedHumanReadableName", "")
                  exported = attachment.get("exportedFileName", "")
                  stem, ext = os.path.splitext(name.split(":", 1)[-1])
                  if not stem.startswith("pr124-") or ext.lower() not in (".png", ".jpeg", ".jpg"):
                      continue
                  source = os.path.join(staging, exported)
                  if not os.path.exists(source):
                      continue
                  destination = os.path.join("ui-screenshots", f"{stem}.png")
                  shutil.copyfile(source, destination)
                  print("exported", destination)
          PY
          else
            echo "Export attachments unavailable; falling back to manifest walk"
            xcrun xcresulttool get --legacy --path ui-e2e.xcresult \
              --format json > ui-e2e-manifest.json
            python3 - <<'PY'
          import json, os, shutil

          with open("ui-e2e-manifest.json") as fh:
              manifest = json.load(fh)
          for action in manifest.get("actions", {}).get("_values", []):
              result = action.get("actionResult", {})
              attachments = result.get("attachments", {}).get("_values", [])
              for attachment in attachments:
                  name = attachment.get("suggestedHumanReadableName", "")
                  exported = attachment.get("exportedFileName", "")
                  if not name or "pr124-" not in name:
                      continue
                  source = os.path.join("ui-e2e.xcresult", exported)
                  if not os.path.exists(source):
                      continue
                  target = name.split(":", 1)[-1]
                  stem, _ = os.path.splitext(target)
                  destination = os.path.join("ui-screenshots", f"{stem}.png")
                  shutil.copyfile(source, destination)
                  print("exported", destination)
          PY
          fi
          rm -rf "$STAGING"
          ls -la ui-screenshots

      - name: Validate exported screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for name in pr124-dashboard pr124-settings-data-export-row pr124-format-picker; do
            file="ui-screenshots/${name}.png"
            if [[ ! -f "${file}" ]]; then
              echo "::warning::Expected screenshot missing: ${file}"
              continue
            fi
            sips -g pixelWidth -g pixelHeight "${file}"
          done

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr124-ui-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: warn

      - name: Upload UI E2E test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-test-logs
          path: ui-e2e-test.log
          if-no-files-found: ignore